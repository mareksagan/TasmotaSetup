esphome:
  name: reterminal-e1001
  friendly_name: "reTerminal E1001"
  on_boot:
    - priority: 600
      then:
        - lambda: |-
            id(boot_count)++;
            ESP_LOGI("main", "========================================");
            ESP_LOGI("main", "BOOT #%d  reset_reason=%d", id(boot_count), esp_reset_reason());
            ESP_LOGI("main", "City=%s  cached_hash=%u  lat=%.4f  lon=%.4f", id(city_select).current_option().c_str(), id(cached_city_hash), id(city_lat_f), id(city_lon_f));
            ESP_LOGI("main", "========================================");
        - output.turn_on: bsp_battery_enable
        - delay: 500ms
        - component.update: sht40
        - component.update: battery_voltage
    - priority: -100
      then:
        - logger.log: "Boot complete, waiting for WiFi..."
        - lambda: |-
            if (!id(wifi_component).has_sta()) {
              ESP_LOGI("wifi", "No STA config found, preventing deep sleep for provisioning");
              id(deep_sleep_1).prevent_deep_sleep();
            }
            if (!id(deep_sleep_enabled).state) {
              ESP_LOGI("sleep", "Deep sleep switch is OFF, preventing sleep");
              id(deep_sleep_1).prevent_deep_sleep();
            }
            id(alarm_hour_num).publish_state(id(alarm_hour));
            id(alarm_minute_num).publish_state(id(alarm_minute));
            ESP_LOGI("alarm", "Synced alarm time to UI: %02d:%02d", id(alarm_hour), id(alarm_minute));

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

api:

logger:
  level: INFO
  baud_rate: 0

wifi:
  id: wifi_component
  on_connect:
    then:
      - logger.log: "WiFi connected, fetching data..."
      - lambda: |-
          id(data_ready_weather) = false;
          id(data_ready_aq) = false;
          id(display_updated) = false;
          ESP_LOGI("main", "Flags reset for new cycle");
      - script.execute: geocode_city
      - script.execute: check_alarm_trigger
  ap:
    ssid: "reTerminal Clock"

captive_portal:

web_server:
  port: 80

ota:
  - platform: esphome

time:
  - platform: sntp
    id: sntp_time
    timezone: "CET-1CEST,M3.5.0,M10.5.0/3"
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - 2.pool.ntp.org
    update_interval: 6h
    on_time_sync:
      then:
        - logger.log: "SNTP time synchronized"
        - component.update: epaper_display

i2c:
  sda: GPIO19
  scl: GPIO20
  scan: false

spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9

http_request:
  verify_ssl: false
  timeout: 15s
  watchdog_timeout: 20s

globals:
