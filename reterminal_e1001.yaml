    restore_value: true
    initial_value: 7
    set_action:
      - lambda: |-
          id(alarm_hour) = x;
          id(last_alarm_minute) = -1;
      - component.update: epaper_display
  - platform: template
    name: "Alarm Minute"
    id: alarm_minute_num
    min_value: 0
    max_value: 59
    step: 1
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 0
    set_action:
      - lambda: |-
          id(alarm_minute) = x;
          id(last_alarm_minute) = -1;
      - component.update: epaper_display
  - platform: template
    name: "Buzzer Level"
    id: buzzer_level_num
    min_value: 0
    max_value: 1
    step: 0.1
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 0.8
    set_action:
      - lambda: |-
          if (id(buzzer_switch).state) {
            id(buzzer_pwm).set_level(x);
          }
          ESP_LOGI("buzzer", "Level set to %.2f", x);

# Deep sleep: wake every 10min or on green button press
# Comment out the deep_sleep block while developing/flashing OTA
deep_sleep:
  id: deep_sleep_1
  run_duration: 90s
  sleep_duration: 10min

sensor:
  - platform: sht4x
    id: sht40
    temperature:
      name: "Indoor Temperature"
      id: sht4x_temp
      accuracy_decimals: 1
    humidity:
      name: "Indoor Humidity"
      id: sht4x_hum
      accuracy_decimals: 1
    address: 0x44
    update_interval: never

  - platform: adc
    pin: GPIO1
    name: "Battery Voltage"
    id: battery_voltage
    attenuation: 12db
    update_interval: never
    filters:
      - multiply: 2.0
    on_value:
      then:
        - component.update: battery_level

  - platform: template
    name: "Battery Level"
    id: battery_level
    unit_of_measurement: "%"
    device_class: battery
    update_interval: never
    lambda: |-
      if (isnan(id(battery_voltage).state)) return NAN;
      float v = id(battery_voltage).state;
      if (v >= 4.15) return 100.0;
      if (v >= 3.96) return 90.0;
      if (v >= 3.91) return 80.0;
      if (v >= 3.85) return 70.0;
      if (v >= 3.80) return 60.0;
      if (v >= 3.75) return 50.0;
      if (v >= 3.68) return 40.0;
      if (v >= 3.58) return 30.0;
      if (v >= 3.49) return 20.0;
      if (v >= 3.41) return 10.0;
      if (v >= 3.30) return 5.0;
      return 0.0;

  # Outdoor data from Open-Meteo
  - platform: template
    name: "Outdoor Temperature"
    id: outdoor_temp
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: never

  - platform: template
    name: "Outdoor Humidity"
    id: outdoor_hum
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    name: "UV Index"
    id: uv_index
    accuracy_decimals: 1
    update_interval: never

  - platform: template
    name: "Weather Code"
    id: weather_code
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    name: "PM2.5"
    id: pm25
    unit_of_measurement: "µg/m³"
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    name: "PM10"
    id: pm10
    unit_of_measurement: "µg/m³"
    accuracy_decimals: 0
    update_interval: never

  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_rssi
    update_interval: 60s

  - platform: uptime
    name: "Uptime"
    id: device_uptime
    update_interval: 60s

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: device_ip
    mac_address:
      name: "MAC Address"
      id: device_mac
    ssid:
      name: "Connected SSID"
      id: wifi_ssid

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
      inverted: true
    id: btn_white_right
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_press:
      then:
        - lambda: |-
            id(btn_right_pressed) = true;
        - script.execute: btn_feedback
        - script.execute: btn_right_nav
    on_release:
      then:
        - lambda: |-
            id(btn_right_pressed) = false;
            id(btn_combo_timer) = 0;

  - platform: gpio
    pin:
      number: GPIO5
      mode: INPUT_PULLUP
      inverted: true
    id: btn_white_left
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_press:
      then:
        - lambda: |-
            id(btn_left_pressed) = true;
        - script.execute: btn_feedback
        - script.execute: btn_left_nav
    on_release:
      then:
        - lambda: |-
            id(btn_left_pressed) = false;
            id(btn_combo_timer) = 0;

  - platform: gpio
    pin:
      number: GPIO3
      mode: INPUT_PULLUP
      inverted: true
    id: btn_green
    filters:
      - delayed_on: 50ms
    on_press:
      then:
        - script.execute: btn_feedback
        - lambda: id(green_press_ms) = millis();
    on_release:
      then:
        - lambda: |-
            uint32_t press = id(green_press_ms);
            uint32_t now = millis();
            id(green_press_ms) = 0;
            if (press == 0) return;

            // Alarm ringing: any green press stops it and returns to main clock screen
            if (id(alarm_active)) {
              ESP_LOGI("alarm", "Alarm stopped by green button");
              id(alarm_active) = false;
              id(alarm_buzzer_on) = false;
              id(buzzer_pwm).set_level(0.0f);
              auto now_time = id(sntp_time).now();
              if (now_time.is_valid()) {
                id(last_alarm_minute) = now_time.hour * 60 + now_time.minute;
              }
              id(current_screen) = 0;
              id(last_nav_ms) = millis();
              id(epaper_display).update();
              return;
            }

            uint32_t duration = now - press;
            if (duration >= 5000) {
              // 5s press: toggle alarm on/off
              id(alarm_enabled) = !id(alarm_enabled);
              id(alarm_enabled_switch).publish_state(id(alarm_enabled));
              id(buzzer_pwm).set_level(0.5f);
              delay(100);
              id(buzzer_pwm).set_level(0.0f);
              if (id(alarm_enabled)) {
                ESP_LOGI("alarm", "Alarm enabled via 5s green press");
              } else {
                ESP_LOGI("alarm", "Alarm disabled via 5s green press");
              }
              id(current_screen) = 2;
              id(last_nav_ms) = millis();
              id(epaper_display).update();
              return;
            }
            if (duration >= 2000) {
              // 2-5s press: enter alarm edit mode
              if (!id(alarm_edit_mode)) {
                ESP_LOGI("alarm", "Entering edit mode");
                id(alarm_edit_mode) = true;
                id(alarm_edit_field) = 0;
                id(current_screen) = 2;
                id(last_nav_ms) = millis();
                id(epaper_display).update();
              }
              return;
            }
            // Short press
            if (id(alarm_edit_mode)) {
              if (id(alarm_edit_field) == 0) {
                id(alarm_edit_field) = 1;
                id(epaper_display).update();
                ESP_LOGI("alarm", "Editing minutes");
              } else {
                id(alarm_edit_mode) = false;
                id(alarm_hour_num).publish_state(id(alarm_hour));
                id(alarm_minute_num).publish_state(id(alarm_minute));
                id(alarm_enabled) = true;
                id(alarm_enabled_switch).publish_state(true);
                id(last_alarm_minute) = -1;
                id(epaper_display).update();
                ESP_LOGI("alarm", "Saved %02d:%02d, alarm enabled", id(alarm_hour), id(alarm_minute));
              }
            } else {
              id(data_ready_weather) = false;
              id(data_ready_aq) = false;
              id(display_updated) = false;
              id(geocode_city).execute();
            }


