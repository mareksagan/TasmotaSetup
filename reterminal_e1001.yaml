            // Colombia / Ecuador / Peru
            if (city == "Bogota" || city == "Medellin" || city == "Cali" || city == "Cartagena" || city == "Barranquilla" || city == "Bucaramanga" || city == "Lima" || city == "Arequipa" || city == "Trujillo" || city == "Cusco" || city == "Quito" || city == "Guayaquil") return "EST5";
            // Venezuela
