            // Argentina / Uruguay / Paraguay
            if (city == "Buenos Aires" || city == "Cordoba" || city == "Rosario" || city == "Mendoza" || city == "Santa Fe" || city == "Montevideo" || city == "Asuncion") return "ART3";
            // Chile
            if (city == "Santiago" || city == "Valparaiso" || city == "Concepcion" || city == "Antofagasta") return "CLT4";
            // Australia East (AEST/AEDT)
            if (city == "Sydney" || city == "Melbourne" || city == "Canberra" || city == "Hobart" || city == "Wollongong" || city == "Newcastle" || city == "Gold Coast" || city == "Cairns" || city == "Townsville") return "AEST-10AEDT,M10.1.0,M4.1.0/3";
            // Australia Central with DST
            if (city == "Adelaide") return "ACST-9:30ACDT,M10.1.0,M4.1.0/3";
            // Australia Central no DST
            if (city == "Darwin") return "ACST-9:30";
            // Australia West
            if (city == "Perth") return "AWST-8";
            // Brisbane no DST
            if (city == "Brisbane") return "AEST-10";
            // New Zealand
            if (city == "Auckland" || city == "Wellington" || city == "Christchurch" || city == "Hamilton" || city == "Dunedin") return "NZST-12NZDT,M9.5.0,M4.1.0/3";
            // Pacific
            if (city == "Suva") return "FJT-12";
            if (city == "Port Moresby") return "PGT-10";
            if (city == "Honolulu") return "HST10";
            if (city == "Papeete") return "TAHT10";
            if (city == "Nuku'alofa") return "TOT-13";
            if (city == "Apia") return "WST-13";
            // Mongolia
            if (city == "Ulaanbaatar") return "ULAT-8";
            // Azerbaijan / Georgia / Armenia
            if (city == "Baku") return "AZT-4";
            if (city == "Tbilisi") return "GET-4";
            if (city == "Yerevan") return "AMT-4";
            // Iceland
            if (city == "Reykjavik") return "GMT0";
            return "UTC0";
          };
          const char* tz = city_to_tz(id(city_select).current_option());
          ESP_LOGI("timezone", "City=%s TZ=%s", id(city_select).current_option().c_str(), tz);
          id(sntp_time).set_timezone(tz);
      - lambda: |-
          auto hash_str = [](const std::string& s) -> uint32_t {
            uint32_t h = 5381;
            for (char c : s) h = ((h << 5) + h) + c;
            return h;
          };
          std::string city = id(city_select).current_option();
          uint32_t current_hash = hash_str(city);
          float lat = id(city_lat_f);
          float lon = id(city_lon_f);
          uint32_t cached_hash = id(cached_city_hash);
          ESP_LOGI("geocode", "City=%s hash=%u cached=%u lat=%.4f lon=%.4f", city.c_str(), current_hash, cached_hash, lat, lon);
          if (current_hash == cached_hash && lat != 0.0f && lon != 0.0f) {
            ESP_LOGI("geocode", "Cache hit, using cached coordinates");
          } else {
            ESP_LOGI("geocode", "Cache miss, will geocode");
            id(city_lat_f) = 0.0f;
            id(city_lon_f) = 0.0f;
            id(cached_city_hash) = 0;
          }
      - if:
          condition:
            lambda: |-
              return id(city_lat_f) != 0.0f && id(city_lon_f) != 0.0f;
          then:
            - script.execute: fetch_weather
            - script.execute: fetch_air_quality
      - if:
          condition:
            lambda: |-
              return id(city_lat_f) == 0.0f || id(city_lon_f) == 0.0f;
          then:
            - lambda: |-
                ESP_LOGI("geocode", "Geocoding %s...", id(city_select).current_option().c_str());
            - lambda: |-
                std::string city = id(city_select).current_option();
                std::string enc;
                for (char c : city) {
                  if (c == ' ') enc += "%20";
                  else enc += c;
                }
                std::string url = std::string("https://geocoding-api.open-meteo.com/v1/search?name=") + enc + "&count=1";
                ESP_LOGI("geocode", "Request URL: %s", url.c_str());
            - http_request.get:
                url: !lambda |-
                  std::string city = id(city_select).current_option();
                  std::string enc;
                  for (char c : city) {
                    if (c == ' ') enc += "%20";
                    else enc += c;
                  }
                  return std::string("https://geocoding-api.open-meteo.com/v1/search?name=") + enc + "&count=1";
                capture_response: true
                max_response_buffer_size: 4096
                on_response:
                  then:
                    - lambda: |-
                        ESP_LOGI("geocode", "HTTP %d, body_len=%d", response->status_code, body.length());
                        if (response->status_code != 200) {
                          ESP_LOGW("geocode", "Geocoding HTTP %d", response->status_code);
                          id(data_ready_weather) = true;
                          id(data_ready_aq) = true;
                          return;
                        }
                        JsonDocument doc;
                        DeserializationError err = deserializeJson(doc, body.c_str());
                        if (err) {
                          ESP_LOGW("geocode", "Geocoding JSON error: %s", err.c_str());
                          id(data_ready_weather) = true;
                          id(data_ready_aq) = true;
                          return;
                        }
                        JsonArray results = doc["results"];
                        if (results.size() == 0) {
                          ESP_LOGW("geocode", "No results for %s", id(city_select).current_option().c_str());
                          id(data_ready_weather) = true;
                          id(data_ready_aq) = true;
                          return;
                        }
                        float lat_f = results[0]["latitude"] | 0.0f;
                        float lon_f = results[0]["longitude"] | 0.0f;
                        id(city_lat_f) = lat_f;
                        id(city_lon_f) = lon_f;
                        auto hash_str = [](const std::string& s) -> uint32_t {
                          uint32_t h = 5381;
                          for (char c : s) h = ((h << 5) + h) + c;
                          return h;
                        };
                        id(cached_city_hash) = hash_str(id(city_select).current_option());
                        ESP_LOGI("geocode", "Resolved %s -> lat=%.4f lon=%.4f hash=%u", id(city_select).current_option().c_str(), lat_f, lon_f, id(cached_city_hash));
                    - script.execute: fetch_weather
                    - script.execute: fetch_air_quality
                on_error:
                  then:
                    - lambda: |-
                        ESP_LOGW("geocode", "Geocoding request failed");
                        id(data_ready_weather) = true;
                        id(data_ready_aq) = true;
                    - script.execute: check_display

  - id: fetch_weather
    mode: single
    then:
      - lambda: |-
          char buf[280];
          snprintf(buf, sizeof(buf), "https://api.open-meteo.com/v1/forecast?latitude=%.4f&longitude=%.4f&current=temperature_2m,relative_humidity_2m,weather_code,uv_index,is_day&daily=sunrise,sunset&timezone=auto", id(city_lat_f), id(city_lon_f));
          ESP_LOGI("weather", "Request URL: %s", buf);
      - http_request.get:
          url: !lambda |-
            char buf[280];
            snprintf(buf, sizeof(buf), "https://api.open-meteo.com/v1/forecast?latitude=%.4f&longitude=%.4f&current=temperature_2m,relative_humidity_2m,weather_code,uv_index,is_day&daily=sunrise,sunset&timezone=auto", id(city_lat_f), id(city_lon_f));
            return std::string(buf);
          capture_response: true
          max_response_buffer_size: 4096
          on_response:
            then:
              - lambda: |-
                  ESP_LOGI("weather", "HTTP status=%d body_len=%d", response->status_code, body.length());
                  if (response->status_code != 200) {
                    ESP_LOGW("weather", "Weather API HTTP %d", response->status_code);
                    id(data_ready_weather) = true;
                    return;
                  }
                  ESP_LOGI("weather", "Body: %.256s", body.c_str());
                  JsonDocument doc;
                  DeserializationError err = deserializeJson(doc, body.c_str());
                  if (err) {
                    ESP_LOGW("weather", "Weather JSON error: %s", err.c_str());
                    id(data_ready_weather) = true;
                    return;
                  }
                  float temp = doc["current"]["temperature_2m"] | NAN;
                  int hum = doc["current"]["relative_humidity_2m"] | 0;
                  float uv = doc["current"]["uv_index"] | NAN;
                  int wcode = doc["current"]["weather_code"] | -1;
                  const char* sr = doc["daily"]["sunrise"][0] | "--:--";
                  const char* ss = doc["daily"]["sunset"][0] | "--:--";
                  ESP_LOGI("weather", "Parsed: temp=%.1f hum=%d uv=%.1f code=%d sr=%s ss=%s", temp, hum, uv, wcode, sr ? sr : "null", ss ? ss : "null");
                  id(outdoor_temp).publish_state(temp);
                  id(outdoor_hum).publish_state(hum);
                  id(uv_index).publish_state(uv);
                  id(weather_code).publish_state(wcode);
                  char sr_time[6] = "--:--";
                  char ss_time[6] = "--:--";
                  const char* t = strchr(sr, 'T');
                  if (t) { strncpy(sr_time, t + 1, 5); sr_time[5] = '\0'; }
                  id(sunrise_time) = sr_time;
                  t = strchr(ss, 'T');
                  if (t) { strncpy(ss_time, t + 1, 5); ss_time[5] = '\0'; }
                  id(sunset_time) = ss_time;
                  const char* wtxt = "Unknown";
                  if (wcode == 0) wtxt = "Clear";
                  else if (wcode == 1) wtxt = "Mainly Clear";
                  else if (wcode == 2) wtxt = "Partly Cloudy";
                  else if (wcode == 3) wtxt = "Overcast";
                  else if (wcode == 45 || wcode == 48) wtxt = "Fog";
                  else if (wcode >= 51 && wcode <= 57) wtxt = "Drizzle";
                  else if (wcode >= 61 && wcode <= 67) wtxt = "Rain";
                  else if (wcode >= 71 && wcode <= 77) wtxt = "Snow";
                  else if (wcode >= 80 && wcode <= 82) wtxt = "Showers";
                  else if (wcode >= 85 && wcode <= 86) wtxt = "Snow Showers";
                  else if (wcode >= 95) wtxt = "Thunderstorm";
                  ESP_LOGI("weather", "Weather text: %s", wtxt);
                  id(weather_text) = wtxt;
                  id(data_ready_weather) = true;
              - script.execute: check_display
          on_error:
            then:
              - lambda: |-
                  ESP_LOGW("weather", "Weather HTTP request failed (network/timeout)");
                  id(data_ready_weather) = true;
              - script.execute: check_display

  - id: fetch_air_quality
    mode: single
    then:
      - lambda: |-
          char buf[280];
          snprintf(buf, sizeof(buf), "https://air-quality-api.open-meteo.com/v1/air-quality?latitude=%.4f&longitude=%.4f&current=pm2_5,pm10&timezone=auto", id(city_lat_f), id(city_lon_f));
          ESP_LOGI("aq", "Request URL: %s", buf);
      - http_request.get:
          url: !lambda |-
            char buf[280];
            snprintf(buf, sizeof(buf), "https://air-quality-api.open-meteo.com/v1/air-quality?latitude=%.4f&longitude=%.4f&current=pm2_5,pm10&timezone=auto", id(city_lat_f), id(city_lon_f));
            return std::string(buf);
          capture_response: true
          max_response_buffer_size: 4096
          on_response:
            then:
              - lambda: |-
                  ESP_LOGI("aq", "HTTP status=%d body_len=%d", response->status_code, body.length());
                  if (response->status_code != 200) {
                    ESP_LOGW("aq", "AQ API HTTP %d", response->status_code);
                    id(data_ready_aq) = true;
                    return;
                  }
                  ESP_LOGI("aq", "Body: %.256s", body.c_str());
                  JsonDocument doc;
                  DeserializationError err = deserializeJson(doc, body.c_str());
                  if (err) {
                    ESP_LOGW("aq", "AQ JSON error: %s", err.c_str());
                    id(data_ready_aq) = true;
                    return;
                  }
                  float pm25_val = doc["current"]["pm2_5"] | NAN;
                  float pm10_val = doc["current"]["pm10"] | NAN;
                  ESP_LOGI("aq", "Parsed: pm25=%.1f pm10=%.1f", pm25_val, pm10_val);
                  id(pm25).publish_state(pm25_val);
                  id(pm10).publish_state(pm10_val);
                  id(data_ready_aq) = true;
              - script.execute: check_display
          on_error:
            then:
              - lambda: |-
                  ESP_LOGW("aq", "AQ HTTP request failed (network/timeout)");
                  id(data_ready_aq) = true;
              - script.execute: check_display

  - id: sleep_after_refresh
    mode: restart
    then:
      - delay: 10s
      - if:
          condition:
            lambda: |-
              return id(wifi_component).has_sta() && id(deep_sleep_enabled).state && !id(alarm_active);
          then:
            - lambda: |-
                // Return to main clock screen before sleeping so the device always wakes on the clock
                if (id(current_screen) != 0) {
                  ESP_LOGI("sleep", "Navigating to main clock screen before deep sleep");
                  id(current_screen) = 0;
                  id(epaper_display).update();
                }
                // Default sleep 10 min
                uint32_t sleep_ms = 10 * 60 * 1000;
                auto now = id(sntp_time).now();
                if (now.is_valid() && id(alarm_enabled) && !id(alarm_active)) {
                  int current_minute = now.hour * 60 + now.minute;
                  int alarm_target_minute = id(alarm_hour) * 60 + id(alarm_minute);
                  int minutes_until = (alarm_target_minute - current_minute + 24 * 60) % (24 * 60);
                  int seconds_until = minutes_until * 60 - now.second;
                  if (seconds_until <= 0) {
                    ESP_LOGI("sleep", "Alarm time reached, triggering alarm instead of sleeping");
                    id(check_alarm_trigger).execute();
                  } else if (seconds_until <= 10 * 60) {
                    sleep_ms = seconds_until * 1000;
                    ESP_LOGI("sleep", "Alarm in %d s, sleeping until alarm", seconds_until);
                  } else {
                    ESP_LOGI("sleep", "Alarm not within 10 min, sleeping 10 min");
                  }
                } else {
                  ESP_LOGI("sleep", "No valid time or alarm disabled, sleeping 10 min");
                }
                id(deep_sleep_1).set_sleep_duration(sleep_ms);
            - if:
                condition:
                  lambda: return !id(alarm_active);
                then:
                  - logger.log: "Display refresh complete, entering deep sleep"
                  - lambda: |-
                      ESP_LOGI("sleep", "Configuring GPIO3 as wake source");
                      esp_err_t err = esp_sleep_enable_ext0_wakeup(GPIO_NUM_3, 0);
                      if (err != ESP_OK) {
                        ESP_LOGE("sleep", "Failed to enable ext0 wakeup: %d", err);
                      }
                  - deep_sleep.enter: deep_sleep_1
          else:
            - lambda: |-
                if (!id(wifi_component).has_sta()) {
                  ESP_LOGI("sleep", "No WiFi STA, staying awake for provisioning");
                } else {
                  ESP_LOGI("sleep", "Deep sleep disabled via switch, staying awake");
                }
                id(deep_sleep_1).prevent_deep_sleep();

  - id: check_display
    mode: single
    then:
      - if:
          condition:
            lambda: |-
              ESP_LOGI("display", "check_display: weather=%d aq=%d updated=%d", id(data_ready_weather), id(data_ready_aq), id(display_updated));
              return id(data_ready_weather) && id(data_ready_aq) && !id(display_updated);
          then:
            - lambda: |-
                ESP_LOGI("display", "Both data sources ready, updating display");
                id(display_updated) = true;
            - component.update: epaper_display
            - script.execute: sleep_after_refresh

  - id: check_alarm_trigger
    mode: single
    then:
      - lambda: |-
          if (!id(alarm_enabled) || id(alarm_active)) return;
          auto now = id(sntp_time).now();
          if (!now.is_valid()) return;
          int current_minute = now.hour * 60 + now.minute;
          if (current_minute == id(last_alarm_minute)) return;
          if (now.hour == id(alarm_hour) && now.minute == id(alarm_minute)) {
            ESP_LOGI("alarm", "ALARM TRIGGERED at %02d:%02d!", now.hour, now.minute);
            id(last_alarm_minute) = current_minute;
            id(alarm_active) = true;
            id(alarm_buzzer_on) = true;
            {
              float level = id(buzzer_level_num).state;
              if (level <= 0.0f || level > 1.0f) level = 0.8f;
              id(buzzer_pwm).set_level(level);
            }
            if (id(current_screen) != 2) {
              id(current_screen) = 2;
              id(last_nav_ms) = millis();
            }
            id(epaper_display).update();
          }

  - id: next_screen
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              uint32_t now = millis();
              return (now - id(last_nav_ms)) >= 50;
          then:
            - lambda: |-
                id(last_nav_ms) = millis();
                id(current_screen) = (id(current_screen) + 1) % 3;
                ESP_LOGI("display", "Next screen -> %d", id(current_screen));
            - component.update: epaper_display
            - script.execute: sleep_after_refresh

  - id: prev_screen
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              uint32_t now = millis();
              return (now - id(last_nav_ms)) >= 50;
          then:
            - lambda: |-
                id(last_nav_ms) = millis();
                id(current_screen) = (id(current_screen) + 3 - 1) % 3;
                ESP_LOGI("display", "Prev screen -> %d", id(current_screen));
            - component.update: epaper_display
            - script.execute: sleep_after_refresh

  - id: btn_right_nav
    mode: restart
    then:
      - delay: 100ms
      - if:
          condition:
            lambda: return !id(btn_left_pressed);
          then:
            - lambda: |-
                ESP_LOGI("nav", "Right button single press detected, screen=%d", id(current_screen));
            - if:
                condition:
                  lambda: return id(alarm_edit_mode);
                then:
                  - lambda: |-
                      if (id(alarm_edit_field) == 0) {
                        id(alarm_hour) = (id(alarm_hour) + 1) % 24;
                      } else {
                        id(alarm_minute) = (id(alarm_minute) + 1) % 60;
                      }
                      ESP_LOGI("alarm", "Edit: %02d:%02d", id(alarm_hour), id(alarm_minute));
                  - component.update: epaper_display
                else:
                  - script.execute: next_screen

  - id: btn_left_nav
    mode: restart
    then:
      - delay: 100ms
      - if:
          condition:
            lambda: return !id(btn_right_pressed);
          then:
            - lambda: |-
                ESP_LOGI("nav", "Left button single press detected, screen=%d", id(current_screen));
            - if:
                condition:
                  lambda: return id(alarm_edit_mode);
                then:
                  - lambda: |-
                      if (id(alarm_edit_field) == 0) {
                        id(alarm_hour) = (id(alarm_hour) + 23) % 24;
                      } else {
                        id(alarm_minute) = (id(alarm_minute) + 59) % 60;
                      }
                      ESP_LOGI("alarm", "Edit: %02d:%02d", id(alarm_hour), id(alarm_minute));
                  - component.update: epaper_display
                else:
                  - script.execute: prev_screen

  - id: btn_feedback
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              return id(buzzer_switch).state && !id(alarm_active);
          then:
            - lambda: id(buzzer_pwm).set_level(0.3f);
            - delay: 50ms
            - lambda: id(buzzer_pwm).set_level(0.0f);

# Fallback: update display at 15s even if HTTP fails
interval:
  - interval: 15s
    then:
      - if:
          condition:
            lambda: |-
              return !id(display_updated);
          then:
            - logger.log: "HTTP fallback timeout reached, forcing display update"
            - lambda: |-
                id(display_updated) = true;
            - component.update: epaper_display
            - script.execute: sleep_after_refresh

  - interval: 100ms
    then:
      - lambda: |-
          if (id(btn_left_pressed) && id(btn_right_pressed)) {
            id(btn_combo_timer)++;

            // 2s combo: toggle deep sleep
            if (id(btn_combo_timer) == 20 && !id(btn_combo_used)) {
              id(btn_combo_used) = true;
              id(deep_sleep_enabled).toggle();
              bool deep_on = id(deep_sleep_enabled).state;
              ESP_LOGI("sleep", "Deep sleep toggled via 2s combo: %s", deep_on ? "ON" : "OFF");
              id(buzzer_pwm).set_level(0.3f);
              delay(50);
              id(buzzer_pwm).set_level(0.0f);
            }

            // Warning beeps leading up to factory reset (only if 2s action not used)
            if (!id(btn_combo_used)) {
              if (id(btn_combo_timer) == 30) {
                id(buzzer_pwm).set_level(0.3f);
              }
              if (id(btn_combo_timer) == 35) {
                id(buzzer_pwm).set_level(0.0f);
              }
              if (id(btn_combo_timer) == 40) {
                id(buzzer_pwm).set_level(0.3f);
              }
              if (id(btn_combo_timer) == 45) {
                id(buzzer_pwm).set_level(0.0f);
              }
            }

            // 5s combo: factory reset (disabled if deep sleep was already toggled this press)
            if (id(btn_combo_timer) >= 50 && !id(btn_combo_used)) {
              id(btn_combo_timer) = 0;
              ESP_LOGI("wifi", "Both buttons held for 5s - FACTORY RESET");
              id(buzzer_pwm).set_level(0.5f);
              global_preferences->reset();
              delay(200);
              id(buzzer_pwm).set_level(0.0f);
              App.safe_reboot();
            }
          } else {
            id(btn_combo_timer) = 0;
            id(btn_combo_used) = false;
          }

  - interval: 30s
    then:
      - script.execute: check_alarm_trigger

  - interval: 30s
    then:
      - lambda: |-
          if (id(current_screen) != 0) return;
          auto now = id(sntp_time).now();
          if (!now.is_valid()) return;
          int current_minute = now.hour * 60 + now.minute;
          if (current_minute != id(last_displayed_minute)) {
            id(last_displayed_minute) = current_minute;
            ESP_LOGI("display", "Minute changed, refreshing main screen");
            id(epaper_display).update();
          }

  - interval: 500ms
    then:
      - lambda: |-
          if (!id(alarm_active)) return;
          id(alarm_buzzer_on) = !id(alarm_buzzer_on);
          if (id(alarm_buzzer_on)) {
            float level = id(buzzer_level_num).state;
            if (level <= 0.0f || level > 1.0f) level = 0.8f;
            id(buzzer_pwm).set_level(level);
          } else {
            id(buzzer_pwm).set_level(0.0f);
          }

display:
  - platform: waveshare_epaper
    id: epaper_display
    model: 7.50inv2p
    cs_pin: GPIO10
    dc_pin: GPIO11
    reset_pin:
      number: GPIO12
      inverted: false
    busy_pin:
      number: GPIO13
      inverted: true
    update_interval: never
    full_update_every: 30
    lambda: |-
      ESP_LOGI("display", "=== Display lambda starting ===");
      ESP_LOGI("display", "Screen=%d city=%s out_temp=%.1f out_hum=%.0f uv=%.1f pm25=%.1f pm10=%.1f batt=%.1f", 
                id(current_screen), id(city_select).current_option().c_str(), id(outdoor_temp).state, id(outdoor_hum).state, 
                id(uv_index).state, id(pm25).state, id(pm10).state, id(battery_level).state);
      // Display colors are inverted on this E1001 panel, so swap black/white
      const auto BLACK  = Color::WHITE;
      const auto WHITE  = Color::BLACK;

      // Helper lambdas for color coding
      auto temp_color = [&](float t) -> Color {
        return BLACK;
      };
      auto uv_color = [&](float uv) -> Color {
        return BLACK;
      };
      auto pm25_status_text = [&](float pm) -> const char* {
        if (isnan(pm)) return "--";
        if (pm <= 12.0f) return "Good (Safe to be outside)";
        if (pm <= 35.4f) return "Moderate (Limit exertion)";
        if (pm <= 55.4f) return "Sensitive (Avoid exertion)";
        if (pm <= 150.4f) return "Unhealthy (Stay indoors)";
        if (pm <= 250.4f) return "Very Unhealthy (Stay inside)";
        return "Hazardous (Emergency)";
      };
      auto pm25_status_color = [&](float pm) -> Color {
        return BLACK;
      };
      auto pm10_status_text = [&](float pm) -> const char* {
        if (isnan(pm)) return "--";
        if (pm <= 54.0f) return "Good (Safe to be outside)";
        if (pm <= 154.0f) return "Moderate (Limit exertion)";
        if (pm <= 254.0f) return "Sensitive (Avoid exertion)";
        if (pm <= 354.0f) return "Unhealthy (Stay indoors)";
        if (pm <= 424.0f) return "Very Unhealthy (Stay inside)";
        return "Hazardous (Emergency)";
      };
      auto pm10_status_color = [&](float pm) -> Color {
        return BLACK;
      };

      it.fill(WHITE);

      if (id(current_screen) == 0) {
        // ===== TOP HEADER BAR =====
      it.filled_rectangle(0, 0, 800, 50, BLACK);

      auto time_now = id(sntp_time).now();
      if (time_now.is_valid()) {
        char date_str[40];
        time_now.strftime(date_str, sizeof(date_str), "%A, %d %b %Y");
        it.print(20, 8, id(font_date), WHITE, date_str);
      }

      // Battery percentage
      float batt = id(battery_level).state;
      char batt_str[16];
      if (isnan(batt)) {
        snprintf(batt_str, sizeof(batt_str), "--%%");
      } else {
        snprintf(batt_str, sizeof(batt_str), "%.0f%%", batt);
      }
      it.print(700, 8, id(font_date), WHITE, batt_str);

      // Format preferences
      bool use_fahrenheit = id(temp_unit_select).current_option() == "Fahrenheit";
      const char* temp_unit = use_fahrenheit ? "°F" : "°C";

      // ===== LARGE TIME =====
      if (time_now.is_valid()) {
        char time_str[16];
        if (id(time_format_select).current_option() == "12-hour") {
          time_now.strftime(time_str, sizeof(time_str), "%I:%M %p");
        } else {
          time_now.strftime(time_str, sizeof(time_str), "%H:%M");
        }
        it.printf(400, 120, id(font_time), BLACK, TextAlign::CENTER, time_str);
        id(last_displayed_minute) = time_now.hour * 60 + time_now.minute;
      }

      // Divider below time
      it.line(20, 205, 780, 205, BLACK);

      // ===== THREE COLUMN INFO =====
      // INDOOR (left)
      it.print(30, 215, id(font_info_bold), BLACK, "INDOOR");
      float in_temp = id(sht4x_temp).state;
      char in_temp_str[16];
      if (isnan(in_temp)) {
        snprintf(in_temp_str, sizeof(in_temp_str), "-- %s", temp_unit);
      } else {
        float in_temp_disp = use_fahrenheit ? in_temp * 9.0f / 5.0f + 32.0f : in_temp;
        snprintf(in_temp_str, sizeof(in_temp_str), "%.1f %s", in_temp_disp, temp_unit);
      }
      it.print(30, 248, id(font_info), temp_color(in_temp), in_temp_str);

      float in_hum = id(sht4x_hum).state;
      char in_hum_str[16];
      if (isnan(in_hum)) {
        snprintf(in_hum_str, sizeof(in_hum_str), "--%%");
      } else {
        snprintf(in_hum_str, sizeof(in_hum_str), "%.0f%%", in_hum);
      }
      it.print(30, 283, id(font_info), BLACK, in_hum_str);

      // CITY (center)
      std::string city_name = id(city_select).current_option();
      for (size_t i = 0; i < city_name.length(); i++) {
        city_name[i] = toupper(city_name[i]);
      }
      it.print(300, 215, id(font_info_bold), BLACK, city_name.c_str());

      float out_temp = id(outdoor_temp).state;
      char out_temp_str[16];
      if (isnan(out_temp)) {
        snprintf(out_temp_str, sizeof(out_temp_str), "-- %s", temp_unit);
      } else {
        float out_temp_disp = use_fahrenheit ? out_temp * 9.0f / 5.0f + 32.0f : out_temp;
        snprintf(out_temp_str, sizeof(out_temp_str), "%.1f %s", out_temp_disp, temp_unit);
      }
      it.print(300, 248, id(font_info), temp_color(out_temp), out_temp_str);

      float out_hum = id(outdoor_hum).state;
      char out_hum_str[16];
      if (isnan(out_hum)) {
        snprintf(out_hum_str, sizeof(out_hum_str), "--%%");
      } else {
        snprintf(out_hum_str, sizeof(out_hum_str), "%.0f%%", out_hum);
      }
      it.print(300, 283, id(font_info), BLACK, out_hum_str);

      // Weather / UV / sunrise-sunset (right)
      it.print(520, 215, id(font_info), BLACK, id(weather_text).c_str());

      float uv = id(uv_index).state;
      char uv_str[16];
      if (isnan(uv)) {
        snprintf(uv_str, sizeof(uv_str), "UVI --");
      } else {
        snprintf(uv_str, sizeof(uv_str), "UVI %.1f", uv);
      }
      it.print(520, 248, id(font_info), uv_color(uv), uv_str);

      char sr_ss_str[40];
      const char* sr = id(sunrise_time).c_str();
      const char* ss = id(sunset_time).c_str();
      int sr_h, sr_m, ss_h, ss_m;
      if (id(time_format_select).current_option() == "12-hour" &&
          sscanf(sr, "%d:%d", &sr_h, &sr_m) == 2 &&
          sscanf(ss, "%d:%d", &ss_h, &ss_m) == 2) {
        const char* sr_ampm = sr_h >= 12 ? "PM" : "AM";
        sr_h = sr_h % 12;
        if (sr_h == 0) sr_h = 12;
        const char* ss_ampm = ss_h >= 12 ? "PM" : "AM";
        ss_h = ss_h % 12;
        if (ss_h == 0) ss_h = 12;
        snprintf(sr_ss_str, sizeof(sr_ss_str), "%d:%02d %s - %d:%02d %s", sr_h, sr_m, sr_ampm, ss_h, ss_m, ss_ampm);
      } else {
        snprintf(sr_ss_str, sizeof(sr_ss_str), "%s - %s", sr, ss);
      }
      it.print(520, 283, id(font_info), BLACK, sr_ss_str);

      // Divider above air quality
      it.line(20, 355, 780, 355, BLACK);

      // ===== AIR QUALITY =====
      it.print(30, 368, id(font_info_bold), BLACK, "AIR QUALITY");

      float pm25_val = id(pm25).state;
      char pm25_score[16];
      if (isnan(pm25_val)) {
        snprintf(pm25_score, sizeof(pm25_score), "--");
      } else {
        snprintf(pm25_score, sizeof(pm25_score), "%.0f/100+", pm25_val);
      }
      it.print(30, 398, id(font_info), BLACK, "PM2.5");
      it.print(160, 398, id(font_info), BLACK, pm25_score);
      it.print(380, 398, id(font_info), pm25_status_color(pm25_val), pm25_status_text(pm25_val));

      float pm10_val = id(pm10).state;
      char pm10_score[16];
      if (isnan(pm10_val)) {
        snprintf(pm10_score, sizeof(pm10_score), "--");
      } else {
        snprintf(pm10_score, sizeof(pm10_score), "%.0f/200+", pm10_val);
      }
      it.print(30, 428, id(font_info), BLACK, "PM10");
      it.print(160, 428, id(font_info), BLACK, pm10_score);
      it.print(380, 428, id(font_info), pm10_status_color(pm10_val), pm10_status_text(pm10_val));

      // (footer area left blank since "Updated" text was removed)
      } else if (id(current_screen) == 1) {
        // ===== INFO SCREEN =====
        it.filled_rectangle(0, 0, 800, 50, BLACK);

        auto time_now = id(sntp_time).now();
        if (time_now.is_valid()) {
          char date_str[40];
          time_now.strftime(date_str, sizeof(date_str), "%A, %d %b %Y");
          it.print(20, 8, id(font_date), WHITE, date_str);
        }

        float batt = id(battery_level).state;
        char batt_str[16];
        if (isnan(batt)) {
          snprintf(batt_str, sizeof(batt_str), "--%%");
        } else {
          snprintf(batt_str, sizeof(batt_str), "%.0f%%", batt);
        }
        it.print(700, 8, id(font_date), WHITE, batt_str);

        it.print(400, 100, id(font_info_bold), BLACK, TextAlign::CENTER, "DEVICE INFO");
        it.line(20, 140, 780, 140, BLACK);

        // Left column: network
        const char* ip = id(device_ip).state.c_str();
        it.print(40, 165, id(font_info_bold), BLACK, "IP Address");
        it.print(40, 195, id(font_info), BLACK, ip[0] ? ip : "Not connected");

        const char* mac = id(device_mac).state.c_str();
        it.print(40, 235, id(font_info_bold), BLACK, "MAC Address");
        it.print(40, 265, id(font_info), BLACK, mac[0] ? mac : "--");

        const char* ssid = id(wifi_ssid).state.c_str();
        it.print(40, 305, id(font_info_bold), BLACK, "WiFi Network");
        it.print(40, 335, id(font_info), BLACK, ssid[0] ? ssid : "--");

        float rssi = id(wifi_rssi).state;
        char rssi_str[32];
        if (isnan(rssi)) {
          snprintf(rssi_str, sizeof(rssi_str), "-- dBm");
        } else {
          snprintf(rssi_str, sizeof(rssi_str), "%.0f dBm", rssi);
        }
        it.print(40, 375, id(font_info_bold), BLACK, "Signal Strength");
        it.print(40, 405, id(font_info), BLACK, rssi_str);

        // Right column: device
        char boot_str[16];
        snprintf(boot_str, sizeof(boot_str), "%d", id(boot_count));
        it.print(420, 165, id(font_info_bold), BLACK, "Boot Count");
        it.print(420, 195, id(font_info), BLACK, boot_str);

        int uptime_s = id(device_uptime).state;
        int days = uptime_s / 86400;
        int hours = (uptime_s % 86400) / 3600;
        int mins = (uptime_s % 3600) / 60;
        char uptime_str[32];
        snprintf(uptime_str, sizeof(uptime_str), "%dd %02d:%02d", days, hours, mins);
        it.print(420, 235, id(font_info_bold), BLACK, "Uptime");
        it.print(420, 265, id(font_info), BLACK, uptime_str);

        const char* deep_sleep_str = id(deep_sleep_enabled).state ? "On" : "Off";
        it.print(420, 305, id(font_info_bold), BLACK, "Deep Sleep");
        it.print(420, 335, id(font_info), BLACK, deep_sleep_str);

        float voltage = id(battery_voltage).state;
        char voltage_str[16];
        if (isnan(voltage)) {
          snprintf(voltage_str, sizeof(voltage_str), "-- V");
        } else {
          snprintf(voltage_str, sizeof(voltage_str), "%.2f V", voltage);
        }
        it.print(420, 375, id(font_info_bold), BLACK, "Voltage");
        it.print(420, 405, id(font_info), BLACK, voltage_str);
      } else {
        // ===== ALARM SCREEN =====
        it.filled_rectangle(0, 0, 800, 50, BLACK);

        auto time_now = id(sntp_time).now();
        if (time_now.is_valid()) {
          char date_str[40];
          time_now.strftime(date_str, sizeof(date_str), "%A, %d %b %Y");
          it.print(20, 8, id(font_date), WHITE, date_str);
        }

        float batt = id(battery_level).state;
        char batt_str[16];
        if (isnan(batt)) {
          snprintf(batt_str, sizeof(batt_str), "--%%");
        } else {
          snprintf(batt_str, sizeof(batt_str), "%.0f%%", batt);
        }
        it.print(700, 8, id(font_date), WHITE, batt_str);

        if (id(alarm_edit_mode)) {
          it.print(400, 100, id(font_info), BLACK, TextAlign::CENTER, "SET ALARM");
        } else {
          it.print(400, 100, id(font_info), BLACK, TextAlign::CENTER, "ALARM");
        }
        it.line(20, 140, 780, 140, BLACK);

        char alarm_str[16];
        int alarm_h = id(alarm_hour);
        int alarm_m = id(alarm_minute);
        if (id(time_format_select).current_option() == "12-hour") {
          const char* ampm = alarm_h >= 12 ? "PM" : "AM";
          alarm_h = alarm_h % 12;
          if (alarm_h == 0) alarm_h = 12;
          snprintf(alarm_str, sizeof(alarm_str), "%02d:%02d %s", alarm_h, alarm_m, ampm);
        } else {
          snprintf(alarm_str, sizeof(alarm_str), "%02d:%02d", alarm_h, alarm_m);
        }
        it.printf(400, 253, id(font_time), BLACK, TextAlign::CENTER, alarm_str);

        if (id(alarm_edit_mode)) {
          const char* edit_label = id(alarm_edit_field) == 0 ? "EDITING HOUR" : "EDITING MINUTE";
          it.print(400, 380, id(font_info), BLACK, TextAlign::CENTER, edit_label);
          it.print(400, 420, id(font_info), BLACK, TextAlign::CENTER, "White: adjust     Green: next/save");
        } else {
          const char* status = id(alarm_active) ? "RINGING!" : (id(alarm_enabled) ? "ENABLED" : "DISABLED");
          if (id(alarm_active)) {
            // Invert: white text on black background for ringing
            it.filled_rectangle(280, 360, 240, 40, BLACK);
            it.print(400, 380, id(font_info), WHITE, TextAlign::CENTER, status);
          } else {
            it.print(400, 380, id(font_info), BLACK, TextAlign::CENTER, status);
          }

          if (time_now.is_valid()) {
            char cur_time[16];
            if (id(time_format_select).current_option() == "12-hour") {
              time_now.strftime(cur_time, sizeof(cur_time), "%I:%M %p");
            } else {
              time_now.strftime(cur_time, sizeof(cur_time), "%H:%M");
            }
            it.print(400, 418, id(font_info), BLACK, TextAlign::CENTER, cur_time);
          }

          if (id(alarm_active)) {
            it.print(400, 455, id(font_info), BLACK, TextAlign::CENTER, "Press green button to stop");
          } else {
            it.print(400, 455, id(font_info), BLACK, TextAlign::CENTER, "Hold 2s to set time and 5s to toggle");
          }
        }
      }
