output:
  - platform: gpio
    pin: GPIO21
    id: bsp_battery_enable

  - platform: gpio
    pin: GPIO6
    id: led_output
    inverted: true

  - platform: ledc
    pin:
      number: GPIO45
      ignore_strapping_warning: true
    id: buzzer_pwm
    frequency: 1000Hz

light:
  - platform: binary
    name: "Status LED"
    output: led_output
    id: onboard_led

button:
  - platform: restart
    id: reboot_device
    name: "Reboot"

switch:
  - platform: template
    name: "Deep Sleep"
    id: deep_sleep_enabled
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    icon: "mdi:sleep"
    turn_on_action:
      - lambda: |-
          ESP_LOGI("sleep", "Deep sleep enabled via switch");
    turn_off_action:
      - lambda: |-
          ESP_LOGI("sleep", "Deep sleep disabled via switch, preventing sleep");
          id(deep_sleep_1).prevent_deep_sleep();

  - platform: template
    name: "Alarm"
    id: alarm_enabled_switch
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    icon: "mdi:alarm"
    turn_on_action:
      - lambda: |-
          id(alarm_enabled) = true;
          ESP_LOGI("alarm", "Alarm enabled");
    turn_off_action:
      - lambda: |-
          id(alarm_enabled) = false;
          id(alarm_active) = false;
          id(buzzer_pwm).set_level(0.0f);
          ESP_LOGI("alarm", "Alarm disabled");

  - platform: template
    name: "Buzzer"
    id: buzzer_switch
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    icon: "mdi:volume-high"
    turn_on_action:
      - lambda: |-
          float level = id(buzzer_level_num).state;
          if (level <= 0.0f || level > 1.0f) level = 0.8f;
          id(buzzer_pwm).set_level(level);
          ESP_LOGI("buzzer", "Buzzer ON at level %.2f", level);
    turn_off_action:
      - lambda: |-
          id(buzzer_pwm).set_level(0.0f);
          ESP_LOGI("buzzer", "Buzzer OFF");

