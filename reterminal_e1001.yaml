            if (city == "New York" || city == "Boston" || city == "Philadelphia" || city == "Baltimore" || city == "Washington DC" || city == "Atlanta" || city == "Charlotte" || city == "Raleigh" || city == "Norfolk" || city == "Richmond" || city == "Pittsburgh" || city == "Cleveland" || city == "Cincinnati" || city == "Indianapolis" || city == "Detroit" || city == "Louisville" || city == "Nashville" || city == "Memphis" || city == "St Louis" || city == "Miami" || city == "Tampa" || city == "Jacksonville" || city == "New Orleans" || city == "Milwaukee" || city == "Toronto" || city == "Ottawa" || city == "Montreal" || city == "Quebec City" || city == "Hamilton" || city == "Halifax") return "EST5EDT,M3.2.0,M11.1.0";
